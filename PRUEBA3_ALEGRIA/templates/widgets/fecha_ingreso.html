<div class="row g-2"{% include "django/forms/widgets/attrs.html" %}>
    {% for widget in widget.subwidgets %}
    <div class="col-4">
        <label for="{{ widget.attrs.id }}" class="form-label">{{ widget.attrs.placeholder }}</label>
        {% include widget.template_name %}
    </div>
    {% endfor %}
</div>
